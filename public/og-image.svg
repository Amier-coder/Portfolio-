<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05060c" />
      <stop offset="1" stop-color="#0b0d17" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c5cff" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(950 120) rotate(120) scale(520)">
      <stop stop-color="#7c5cff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" />
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630" />
  </g>

  <text x="90" y="250" fill="#ffffff" font-family="Sora, Segoe UI, sans-serif" font-size="76" font-weight="800">
    Ameer Hamza
  </text>
  <text x="90" y="330" fill="url(#accent)" font-family="Sora, Segoe UI, sans-serif" font-size="42" font-weight="700">
    Full-Stack Web Developer
  </text>
  <text x="90" y="410" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="26">
    React · TypeScript · Node.js · Tailwind CSS
